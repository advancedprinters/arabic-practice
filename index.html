<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Language Coach">
<meta name="theme-color" content="#faf7f2">
<title>Language Coach</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2420;--a:#b5651d;--soft:#f5efe4;--line:#e0d5c5;--muted:#8a7d6d;--ok:#317a49;--bad:#a43b32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 30px)}
.app{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:4px 0;color:var(--a);font-size:1.35rem}.top small{color:var(--muted)}
button,select{font:inherit}.share,.btn,.chip,.choice,.lang{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px;font-weight:700}.lang{padding:9px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}.stat b{display:block}.stat span{font-size:.68rem;color:var(--muted)}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--soft);padding:4px;border-radius:14px;position:sticky;top:6px;z-index:4}nav button{border:0;background:transparent;padding:9px 2px;border-radius:10px;font-size:.75rem;font-weight:800;color:var(--muted)}nav button.on{background:#fff;color:var(--a)}
section{display:none;margin-top:14px}section.on{display:block}.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:700}.tabs button.on{background:var(--a);color:#fff}
.card,.box{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:10px}.card{text-align:center;padding:24px 16px}.target{font-size:2rem;line-height:1.4}.target.arabic{direction:rtl;font-family:"Geeza Pro","Traditional Arabic",sans-serif;font-size:3rem}.trans{color:var(--muted);margin-top:4px}.meaning{margin-top:8px}.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:15px}.form{background:var(--soft);border-radius:10px;padding:8px}.form small{display:block;color:var(--muted)}.form b{font-size:1.5rem}.hidden{display:none}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sound{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.sound button{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:11px;font-weight:800;color:#7a3e0e}.primary{background:var(--a)!important;color:#fff;border-color:var(--a)!important}
textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:1rem}.result{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 10px;font-size:.76rem}.choice{display:block;width:100%;text-align:left;margin:7px 0}.choice.good{background:#eef8f1;border-color:var(--ok)}.choice.bad{background:#fff0ee;border-color:var(--bad)}.note{font-size:.72rem;color:var(--muted);line-height:1.5}.saved div{padding:9px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body><div class="app">
<div class="top"><div><h1 id="title">Language Coach</h1><small id="subtitle">Learn · Hear · Translate · Challenge</small></div><div><select id="language" class="lang"><option value="ar">🇸🇦 Arabic</option><option value="es">🇪🇸 Spanish</option></select> <button class="share" id="share">Share</button></div></div>
<div class="stats"><div class="stat"><b id="streak">0</b><span>day streak</span></div><div class="stat"><b id="count">0</b><span>practiced</span></div><div class="stat"><b id="score">0%</b><span>challenge</span></div></div>
<nav><button class="on" data-v="learn">Learn</button><button data-v="translate">Translate</button><button data-v="challenge">Challenge</button><button data-v="progress">Progress</button></nav>
<section id="learn" class="on"><div class="tabs" id="learnTabs"><button class="on" data-d="letters">Letters</button><button data-d="words">Words</button><button data-d="sentences">Sentences</button></div><div class="card" id="learnCard"><div class="target" id="target"></div><b id="name"></b><div class="trans" id="trans"></div><div class="meaning hidden" id="meaning"></div><div class="forms hidden" id="forms"><div class="form"><small>Initial</small><b id="f1"></b></div><div class="form"><small>Medial</small><b id="f2"></b></div><div class="form"><small>Final</small><b id="f3"></b></div></div><div class="note" id="hint">Tap card to reveal</div></div><div class="sound"><button id="hear">🔊 Hear</button><button id="slow">🐢 Slow</button></div><div class="row"><button class="btn" id="prev">Prev</button><button class="btn" id="shuffle">Shuffle</button><button class="btn primary" id="next">Next</button></div></section>
<section id="translate"><div class="box"><b id="translateTitle">English → Arabic</b><p class="note" id="translateNote">Type what you want to say.</p><textarea id="input" placeholder="Example: I would like a cup of coffee"></textarea><div class="row" style="grid-template-columns:1fr 1fr;margin-top:8px"><button class="btn" id="clear">Clear</button><button class="btn primary" id="make">Translate</button></div><div class="result hidden" id="result"><div class="target" id="outTarget"></div><div class="trans" id="outTrans"></div><div class="sound"><button id="outHear">🔊 Hear</button><button id="outSlow">🐢 Hear slowly</button></div><div class="chips"><button class="chip" id="save">★ Save</button><button class="chip" id="copy">Copy</button></div><p class="note" id="outNote"></p></div></div><div class="box"><b>Quick phrases</b><div class="chips" id="quick"></div></div></section>
<section id="challenge"><div class="box"><b id="qtype">Challenge</b><h3 id="qprompt"></h3><div id="choices"></div><p id="feedback"></p><div class="row" style="grid-template-columns:1fr 1fr"><button class="btn" id="qhear">🔊 Hear answer</button><button class="btn primary" id="qnext">Next</button></div></div></section>
<section id="progress"><div class="box"><b>Your saved phrases</b><div class="saved" id="saved"></div></div><button class="btn" id="reset">Reset progress on this phone</button></section>
</div>
<script>
const DATA={
ar:{name:"Arabic",code:"ar-SA",dir:"rtl",classes:"arabic",letters:[['Alif','a / ā','ا','ا','ـا','ـا'],['Ba','b','ب','بـ','ـبـ','ـب'],['Ta','t','ت','تـ','ـتـ','ـت'],['Tha','th','ث','ثـ','ـثـ','ـث'],['Jim','j','ج','جـ','ـجـ','ـج'],['Ha','ḥ','ح','حـ','ـحـ','ـح'],['Kha','kh','خ','خـ','ـخـ','ـخ'],['Dal','d','د','د','ـد','ـد'],['Dhal','dh','ذ','ذ','ـذ','ـذ'],['Ra','r','ر','ر','ـر','ـر'],['Zay','z','ز','ز','ـز','ـز'],['Sin','s','س','سـ','ـسـ','ـس'],['Shin','sh','ش','شـ','ـشـ','ـش'],['Sad','ṣ','ص','صـ','ـصـ','ـص'],['Dad','ḍ','ض','ضـ','ـضـ','ـض'],['Ta heavy','ṭ','ط','طـ','ـطـ','ـط'],['Za heavy','ẓ','ظ','ظـ','ـظـ','ـظ'],['Ayn','ʿ','ع','عـ','ـعـ','ـع'],['Ghayn','gh','غ','غـ','ـغـ','ـغ'],['Fa','f','ف','فـ','ـفـ','ـف'],['Qaf','q','ق','قـ','ـقـ','ـق'],['Kaf','k','ك','كـ','ـكـ','ـك'],['Lam','l','ل','لـ','ـلـ','ـل'],['Mim','m','م','مـ','ـمـ','ـم'],['Nun','n','ن','نـ','ـنـ','ـن'],['Ha soft','h','ه','هـ','ـهـ','ـه'],['Waw','w / ū','و','و','ـو','ـو'],['Ya','y / ī','ي','يـ','ـيـ','ـي']],words:[['hello','مرحبا','marhaba'],['thank you','شكراً','shukran'],['please','من فضلك','min fadlak'],['yes','نعم','na’am'],['no','لا','la'],['house','بيت','bayt'],['water','ماء','maa’'],['food','طعام','ta’am'],['friend','صديق','sadeeq'],['book','كتاب','kitab'],['car','سيارة','sayyara'],['work','عمل','amal'],['time','وقت','waqt'],['city','مدينة','madina'],['beautiful','جميل','jameel'],['big','كبير','kabeer'],['small','صغير','sagheer'],['today','اليوم','al-yawm'],['tomorrow','غداً','ghadan'],['family','عائلة','a’ila'],['love','حب','hubb'],['peace','سلام','salam']],sentences:[['How are you?','كيف حالك؟','kayfa haaluk?'],['I am fine, thank you','أنا بخير، شكراً','ana bikhayr, shukran'],['Where are you from?','من أين أنت؟','min ayna anta?'],['I am from America','أنا من أمريكا','ana min amreeka'],['What time is it?','كم الساعة؟','kam as-sa’a?'],['Where is the bathroom?','أين الحمام؟','ayna al-hammam?'],['I want to go home','أريد أن أذهب إلى البيت','ureedu an adhhaba ila al-bayt'],['Do you speak English?','هل تتكلم الإنجليزية؟','hal tatakallam al-injleeziyya?'],['I do not understand','لا أفهم','la afham'],['How much is this?','كم هذا؟','kam hadha?'],['I am hungry','أنا جائع','ana ja’i’'],['This is delicious','هذا لذيذ','hadha ladheedh'],['See you tomorrow','أراك غداً','araka ghadan'],['Goodbye','مع السلامة','ma’a as-salama'],['Please speak slowly','من فضلك تكلم ببطء','min fadlak takallam bibut’']],quick:[['I would like coffee','أريد قهوة','ureedu qahwa'],['Where is the bathroom?','أين الحمام؟','ayna al-hammam?'],['How much is this?','كم هذا؟','kam hadha?'],['I do not understand','لا أفهم','la afham'],['Please speak slowly','من فضلك تكلم ببطء','min fadlak takallam bibut’'],['Thank you very much','شكراً جزيلاً','shukran jazeelan']]},
es:{name:"Spanish",code:"es-ES",dir:"ltr",classes:"",letters:[['A','ah','A'],['B','beh','B'],['C','seh','C'],['D','deh','D'],['E','eh','E'],['F','eh-feh','F'],['G','heh','G'],['H','ah-cheh','H'],['I','ee','I'],['J','ho-tah','J'],['K','kah','K'],['L','eh-leh','L'],['M','eh-meh','M'],['N','eh-neh','N'],['Ñ','eh-nyeh','Ñ'],['O','oh','O'],['P','peh','P'],['Q','koo','Q'],['R','eh-rreh','R'],['S','eh-seh','S'],['T','teh','T'],['U','oo','U'],['V','oo-beh','V'],['W','oo-beh doh-bleh','W'],['X','eh-kees','X'],['Y','ee gree-eh-gah','Y'],['Z','seh-tah','Z']],words:[['hello','hola','OH-lah'],['thank you','gracias','GRAH-syahs'],['please','por favor','por fah-VOR'],['yes','sí','see'],['no','no','noh'],['house','casa','KAH-sah'],['water','agua','AH-gwah'],['food','comida','koh-MEE-dah'],['friend','amigo','ah-MEE-goh'],['book','libro','LEE-broh'],['car','carro','KAH-rroh'],['work','trabajo','trah-BAH-hoh'],['time','tiempo','TYEM-poh'],['city','ciudad','syoo-DAHD'],['beautiful','bonito','boh-NEE-toh'],['big','grande','GRAHN-deh'],['small','pequeño','peh-KEH-nyoh'],['today','hoy','oy'],['tomorrow','mañana','mah-NYAH-nah'],['family','familia','fah-MEE-lyah'],['love','amor','ah-MOR'],['peace','paz','pahs']],sentences:[['How are you?','¿Cómo estás?','KOH-moh ehs-TAHS'],['I am fine, thank you','Estoy bien, gracias','ehs-TOY byehn, GRAH-syahs'],['Where are you from?','¿De dónde eres?','deh DOHN-deh EH-rehs'],['I am from America','Soy de América','soy deh ah-MEH-ree-kah'],['What time is it?','¿Qué hora es?','keh OH-rah ehs'],['Where is the bathroom?','¿Dónde está el baño?','DOHN-deh ehs-TAH el BAH-nyoh'],['I want to go home','Quiero ir a casa','KYEH-roh eer ah KAH-sah'],['Do you speak English?','¿Hablas inglés?','AH-blahs een-GLEHS'],['I do not understand','No entiendo','noh ehn-TYEHN-doh'],['How much is this?','¿Cuánto cuesta esto?','KWAHN-toh KWEHS-tah EHS-toh'],['I am hungry','Tengo hambre','TEHN-goh AHM-breh'],['This is delicious','Esto está delicioso','EHS-toh ehs-TAH deh-lee-SYOH-soh'],['See you tomorrow','Hasta mañana','AHS-tah mah-NYAH-nah'],['Goodbye','Adiós','ah-DYOHS'],['Please speak slowly','Por favor, habla despacio','por fah-VOR, AH-blah dehs-PAH-syoh']],quick:[['I would like coffee','Quisiera café','kee-SYEH-rah kah-FEH'],['Where is the bathroom?','¿Dónde está el baño?','DOHN-deh ehs-TAH el BAH-nyoh'],['How much is this?','¿Cuánto cuesta esto?','KWAHN-toh KWEHS-tah EHS-toh'],['I do not understand','No entiendo','noh ehn-TYEHN-doh'],['Please speak slowly','Por favor, habla despacio','por fah-VOR, AH-blah dehs-PAH-syoh'],['Thank you very much','Muchas gracias','MOO-chahs GRAH-syahs']]}}
;
let lang=localStorage.getItem('coachLang')||'ar';
const STORE='languageCoachV2'; const S=JSON.parse(localStorage.getItem(STORE)||'{}');S.count=S.count||{};S.right=S.right||{};S.total=S.total||{};S.saved=S.saved||{};S.streak=S.streak||0;S.last=S.last||'';
function cur(){return DATA[lang]} function all(){return [...cur().words,...cur().sentences]}
function day(){let d=new Date().toISOString().slice(0,10);if(S.last!==d){let y=new Date();y.setDate(y.getDate()-1);S.streak=S.last===y.toISOString().slice(0,10)?S.streak+1:1;S.last=d}}
function store(){localStorage.setItem(STORE,JSON.stringify(S));stats()}function stats(){streak.textContent=S.streak;count.textContent=S.count[lang]||0;let t=S.total[lang]||0,r=S.right[lang]||0;score.textContent=t?Math.round(r/t*100)+'%':'0%';let ss=S.saved[lang]||[];saved.innerHTML=ss.length?ss.map(x=>`<div><b>${x[0]}</b><div style="font-size:1.35rem;direction:${cur().dir}">${x[1]}</div><small>${x[2]||''}</small></div>`).join(''):'<p class="note">No saved phrases yet.</p>'}
function practiced(){day();S.count[lang]=(S.count[lang]||0)+1;store()}
function speak(t,slow=false){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=cur().code;u.rate=slow?.62:.9;speechSynthesis.speak(u)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.v).classList.add('on');stats()});
let deck='letters',i=0,reveal=false;
function D(){return deck==='letters'?cur().letters:deck==='words'?cur().words:cur().sentences}
function render(){let x=D()[i];reveal=false;meaning.classList.add('hidden');forms.classList.add('hidden');target.style.direction=cur().dir;target.className='target '+cur().classes;if(deck==='letters'){target.textContent=x[2];name.textContent=x[0];trans.textContent=x[1];meaning.textContent='';if(lang==='ar'){forms.style.display='grid';[f1,f2,f3].forEach((e,k)=>e.textContent=x[k+3]||'')}else forms.style.display='none'}else{target.textContent=x[1];name.textContent='';trans.textContent=x[2];meaning.textContent=x[0];forms.style.display='none'}hint.textContent=`${i+1} / ${D().length} · Tap card to reveal`}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');deck=b.dataset.d;i=0;render()});
learnCard.onclick=()=>{reveal=!reveal;(deck==='letters'&&lang==='ar'?forms:meaning).classList.toggle('hidden',!reveal);if(reveal)practiced()};next.onclick=()=>{i=(i+1)%D().length;render()};prev.onclick=()=>{i=(i-1+D().length)%D().length;render()};shuffle.onclick=()=>{i=Math.floor(Math.random()*D().length);render()};hear.onclick=()=>{speak(deck==='letters'?D()[i][2]:D()[i][1]);practiced()};slow.onclick=()=>{speak(deck==='letters'?D()[i][2]:D()[i][1],true);practiced()};
let current=null;
function quickBuild(){quick.innerHTML='';cur().quick.forEach(x=>{let b=document.createElement('button');b.className='chip';b.textContent=x[0];b.onclick=()=>{input.value=x[0];show(x,'Built-in learner phrase')};quick.appendChild(b)})}
function show(x,n){current=x;outTarget.style.direction=cur().dir;outTarget.className='target '+cur().classes;outTarget.textContent=x[1];outTrans.textContent=x[2]||'Use Hear to practice pronunciation';outNote.textContent=n;result.classList.remove('hidden');day();store()}
make.onclick=async()=>{let q=input.value.trim();if(!q)return;let x=[...all(),...cur().quick].find(a=>a[0].toLowerCase()===q.toLowerCase());if(x)return show(x,'Built-in learner phrase');make.disabled=true;make.textContent='Translating…';try{let pair=lang==='ar'?'en|ar':'en|es';let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+pair);let j=await r.json();show([q,j.responseData.translatedText,''],'Live translation · use Hear for pronunciation')}catch(e){outNote.textContent='Could not connect to live translation. Try again with internet access.';result.classList.remove('hidden')}finally{make.disabled=false;make.textContent='Translate'}};
clear.onclick=()=>{input.value='';result.classList.add('hidden')};outHear.onclick=()=>current&&speak(current[1]);outSlow.onclick=()=>current&&speak(current[1],true);save.onclick=()=>{if(!current)return;S.saved[lang]=S.saved[lang]||[];if(!S.saved[lang].some(x=>x[1]===current[1]))S.saved[lang].push(current);store();save.textContent='Saved ✓'};copy.onclick=async()=>{if(current){await navigator.clipboard.writeText(current[1]);copy.textContent='Copied ✓'}};
let qa=null,locked=false;function quiz(){locked=false;feedback.textContent='';let a=all();qa=a[Math.floor(Math.random()*a.length)];let en2=Math.random()<.5;qtype.textContent=en2?`Choose the ${cur().name} meaning`:'Choose the English meaning';qprompt.textContent=en2?qa[0]:qa[1];let opts=[qa,...a.filter(x=>x!==qa).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);choices.innerHTML='';opts.forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=en2?x[1]:x[0];b.onclick=()=>{if(locked)return;locked=true;S.total[lang]=(S.total[lang]||0)+1;if(x===qa){S.right[lang]=(S.right[lang]||0)+1;b.classList.add('good');feedback.textContent='Correct ✓'}else{b.classList.add('bad');[...choices.children].forEach((c,k)=>{if(opts[k]===qa)c.classList.add('good')});feedback.textContent='Review the green answer.'}day();store()};choices.appendChild(b)})}
qnext.onclick=quiz;qhear.onclick=()=>qa&&speak(qa[1],true);reset.onclick=()=>{if(confirm('Reset all language progress on this phone?')){localStorage.removeItem(STORE);location.reload()}};
share.onclick=async()=>{let d={title:'Language Coach',text:'Practice languages with me',url:location.href};if(navigator.share)try{await navigator.share(d)}catch(e){}else navigator.clipboard.writeText(location.href)};
function applyLang(){localStorage.setItem('coachLang',lang);language.value=lang;title.textContent=cur().name+' Coach';translateTitle.textContent='English → '+cur().name;translateNote.textContent='Type what you want to say. Built-in phrases work instantly; new phrases use an online translation service.';deck='letters';i=0;document.querySelectorAll('.tabs button').forEach((b,k)=>b.classList.toggle('on',k===0));result.classList.add('hidden');current=null;quickBuild();render();quiz();stats()}
language.onchange=()=>{lang=language.value;applyLang()};applyLang();
</script></body></html>
