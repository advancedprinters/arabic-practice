<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Arabic Coach"><meta name="theme-color" content="#faf7f2"><title>Arabic Coach</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2420;--a:#b5651d;--soft:#f5efe4;--line:#e0d5c5;--muted:#8a7d6d;--ok:#317a49;--bad:#a43b32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 30px)}.app{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.top h1{margin:4px 0;color:var(--a);font-size:1.35rem}.top small{color:var(--muted)}button{font:inherit}.share,.btn,.chip,.choice{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}.stat b{display:block}.stat span{font-size:.68rem;color:var(--muted)}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--soft);padding:4px;border-radius:14px;position:sticky;top:6px;z-index:4}nav button{border:0;background:transparent;padding:9px 2px;border-radius:10px;font-size:.75rem;font-weight:800;color:var(--muted)}nav button.on{background:#fff;color:var(--a)}section{display:none;margin-top:14px}section.on{display:block}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:700}.tabs button.on{background:var(--a);color:#fff}.card,.box{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:10px}.card{text-align:center;padding:24px 16px}.arabic{direction:rtl;font-family:"Geeza Pro","Traditional Arabic",sans-serif;font-size:3rem;line-height:1.4}.word{font-size:2rem}.trans{color:var(--muted);margin-top:4px}.meaning{margin-top:8px}.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:15px}.form{background:var(--soft);border-radius:10px;padding:8px}.form small{display:block;color:var(--muted)}.form b{font-size:1.5rem}.hidden{display:none}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sound{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.sound button{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:11px;font-weight:800;color:#7a3e0e}.primary{background:var(--a)!important;color:#fff;border-color:var(--a)!important}textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:1rem}.result{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.result .arabic{font-size:2rem}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 10px;font-size:.76rem}.choice{display:block;width:100%;text-align:left;margin:7px 0}.choice.good{background:#eef8f1;border-color:var(--ok)}.choice.bad{background:#fff0ee;border-color:var(--bad)}.note{font-size:.72rem;color:var(--muted);line-height:1.5}.saved div{padding:9px 0;border-bottom:1px solid var(--line)}
</style></head>
<body><div class="app">
<div class="top"><div><h1>Arabic Coach</h1><small>Learn · Hear · Translate · Challenge</small></div><button class="share" id="share">Share</button></div>
<div class="stats"><div class="stat"><b id="streak">0</b><span>day streak</span></div><div class="stat"><b id="count">0</b><span>practiced</span></div><div class="stat"><b id="score">0%</b><span>challenge</span></div></div>
<nav><button class="on" data-v="learn">Learn</button><button data-v="translate">Translate</button><button data-v="challenge">Challenge</button><button data-v="progress">Progress</button></nav>
<section id="learn" class="on"><div class="tabs"><button class="on" data-d="letters">Letters</button><button data-d="words">Words</button><button data-d="sentences">Sentences</button></div><div class="card" id="learnCard"><div class="arabic" id="ar"></div><b id="name"></b><div class="trans" id="tr"></div><div class="meaning hidden" id="meaning"></div><div class="forms hidden" id="forms"><div class="form"><small>Initial</small><b id="f1"></b></div><div class="form"><small>Medial</small><b id="f2"></b></div><div class="form"><small>Final</small><b id="f3"></b></div></div><div class="note" id="hint">Tap card to reveal</div></div><div class="sound"><button id="hear">🔊 Hear</button><button id="slow">🐢 Slow</button></div><div class="row"><button class="btn" id="prev">Prev</button><button class="btn" id="shuffle">Shuffle</button><button class="btn primary" id="next">Next</button></div></section>
<section id="translate"><div class="box"><b>English → Arabic</b><p class="note">Type what you want to say. Built-in phrases work instantly; new phrases use an online translation service.</p><textarea id="input" placeholder="Example: I would like a cup of coffee"></textarea><div class="row" style="grid-template-columns:1fr 1fr;margin-top:8px"><button class="btn" id="clear">Clear</button><button class="btn primary" id="make">Make it Arabic</button></div><div class="result hidden" id="result"><div class="arabic" id="outAr"></div><div class="trans" id="outTr"></div><div class="sound"><button id="outHear">🔊 Hear Arabic</button><button id="outSlow">🐢 Hear slowly</button></div><div class="chips"><button class="chip" id="save">★ Save</button><button class="chip" id="copy">Copy Arabic</button></div><p class="note" id="outNote"></p></div></div><div class="box"><b>Quick phrases</b><div class="chips" id="quick"></div></div></section>
<section id="challenge"><div class="box"><b id="qtype">Challenge</b><h3 id="qprompt"></h3><div id="choices"></div><p id="feedback"></p><div class="row" style="grid-template-columns:1fr 1fr"><button class="btn" id="qhear">🔊 Hear answer</button><button class="btn primary" id="qnext">Next</button></div></div></section>
<section id="progress"><div class="box"><b>Your saved phrases</b><div class="saved" id="saved"></div></div><button class="btn" id="reset">Reset progress on this phone</button></section>
</div><script>
const letters=[['Alif','a / ā','ا','ا','ـا','ـا'],['Ba','b','ب','بـ','ـبـ','ـب'],['Ta','t','ت','تـ','ـتـ','ـت'],['Tha','th','ث','ثـ','ـثـ','ـث'],['Jim','j','ج','جـ','ـجـ','ـج'],['Ha','ḥ','ح','حـ','ـحـ','ـح'],['Kha','kh','خ','خـ','ـخـ','ـخ'],['Dal','d','د','د','ـد','ـد'],['Dhal','dh','ذ','ذ','ـذ','ـذ'],['Ra','r','ر','ر','ـر','ـر'],['Zay','z','ز','ز','ـز','ـز'],['Sin','s','س','سـ','ـسـ','ـس'],['Shin','sh','ش','شـ','ـشـ','ـش'],['Sad','ṣ','ص','صـ','ـصـ','ـص'],['Dad','ḍ','ض','ضـ','ـضـ','ـض'],['Ta heavy','ṭ','ط','طـ','ـطـ','ـط'],['Za heavy','ẓ','ظ','ظـ','ـظـ','ـظ'],['Ayn','ʿ','ع','عـ','ـعـ','ـع'],['Ghayn','gh','غ','غـ','ـغـ','ـغ'],['Fa','f','ف','فـ','ـفـ','ـف'],['Qaf','q','ق','قـ','ـقـ','ـق'],['Kaf','k','ك','كـ','ـكـ','ـك'],['Lam','l','ل','لـ','ـلـ','ـل'],['Mim','m','م','مـ','ـمـ','ـم'],['Nun','n','ن','نـ','ـنـ','ـن'],['Ha soft','h','ه','هـ','ـهـ','ـه'],['Waw','w / ū','و','و','ـو','ـو'],['Ya','y / ī','ي','يـ','ـيـ','ـي']];
const words=[['hello','مرحبا','marhaba'],['thank you','شكراً','shukran'],['please','من فضلك','min fadlak'],['yes','نعم','na’am'],['no','لا','la'],['house','بيت','bayt'],['water','ماء','maa’'],['food','طعام','ta’am'],['friend','صديق','sadeeq'],['book','كتاب','kitab'],['car','سيارة','sayyara'],['work','عمل','amal'],['time','وقت','waqt'],['city','مدينة','madina'],['beautiful','جميل','jameel'],['big','كبير','kabeer'],['small','صغير','sagheer'],['today','اليوم','al-yawm'],['tomorrow','غداً','ghadan'],['family','عائلة','a’ila'],['love','حب','hubb'],['peace','سلام','salam']];
const sentences=[['How are you?','كيف حالك؟','kayfa haaluk?'],['I am fine, thank you','أنا بخير، شكراً','ana bikhayr, shukran'],['Where are you from?','من أين أنت؟','min ayna anta?'],['I am from America','أنا من أمريكا','ana min amreeka'],['What time is it?','كم الساعة؟','kam as-sa’a?'],['Where is the bathroom?','أين الحمام؟','ayna al-hammam?'],['I want to go home','أريد أن أذهب إلى البيت','ureedu an adhhaba ila al-bayt'],['Do you speak English?','هل تتكلم الإنجليزية؟','hal tatakallam al-injleeziyya?'],['I do not understand','لا أفهم','la afham'],['How much is this?','كم هذا؟','kam hadha?'],['I am hungry','أنا جائع','ana ja’i’'],['This is delicious','هذا لذيذ','hadha ladheedh'],['See you tomorrow','أراك غداً','araka ghadan'],['Goodbye','مع السلامة','ma’a as-salama'],['Please speak slowly','من فضلك تكلم ببطء','min fadlak takallam bibut’']];
const all=[...words,...sentences], S=JSON.parse(localStorage.getItem('arabicCoach')||'{}');S.count=S.count||0;S.right=S.right||0;S.total=S.total||0;S.saved=S.saved||[];S.streak=S.streak||0;S.last=S.last||'';
function day(){let d=new Date().toISOString().slice(0,10);if(S.last!==d){let y=new Date();y.setDate(y.getDate()-1);S.streak=S.last===y.toISOString().slice(0,10)?S.streak+1:1;S.last=d}}function store(){localStorage.setItem('arabicCoach',JSON.stringify(S));stats()}function stats(){streak.textContent=S.streak;count.textContent=S.count;score.textContent=S.total?Math.round(S.right/S.total*100)+'%':'0%';saved.innerHTML=S.saved.length?S.saved.map(x=>`<div><b>${x[0]}</b><div dir="rtl" style="font-size:1.35rem">${x[1]}</div><small>${x[2]||''}</small></div>`).join(''):'<p class="note">No saved phrases yet.</p>'}function practiced(){day();S.count++;store()}function speak(t,slow=false){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=slow?.62:.88;speechSynthesis.speak(u)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.v).classList.add('on');stats()});
let deck='letters',i=0,reveal=false;function D(){return deck==='letters'?letters:deck==='words'?words:sentences}function render(){let x=D()[i];reveal=false;meaning.classList.add('hidden');forms.classList.add('hidden');if(deck==='letters'){ar.textContent=x[2];ar.className='arabic';name.textContent=x[0];tr.textContent=x[1];meaning.textContent='';forms.style.display='grid';[f1,f2,f3].forEach((e,k)=>e.textContent=x[k+3])}else{ar.textContent=x[1];ar.className='arabic word';name.textContent='';tr.textContent=x[2];meaning.textContent=x[0];forms.style.display='none'}hint.textContent=`${i+1} / ${D().length} · Tap card to reveal`}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');deck=b.dataset.d;i=0;render()});learnCard.onclick=()=>{reveal=!reveal;(deck==='letters'?forms:meaning).classList.toggle('hidden',!reveal);if(reveal)practiced()};next.onclick=()=>{i=(i+1)%D().length;render()};prev.onclick=()=>{i=(i-1+D().length)%D().length;render()};shuffle.onclick=()=>{i=Math.floor(Math.random()*D().length);render()};hear.onclick=()=>{speak(deck==='letters'?D()[i][2]:D()[i][1]);practiced()};slow.onclick=()=>{speak(deck==='letters'?D()[i][2]:D()[i][1],true);practiced()};
const qp=[['I would like coffee','أريد قهوة','ureedu qahwa'],['Where is the bathroom?','أين الحمام؟','ayna al-hammam?'],['How much is this?','كم هذا؟','kam hadha?'],['I do not understand','لا أفهم','la afham'],['Please speak slowly','من فضلك تكلم ببطء','min fadlak takallam bibut’'],['Thank you very much','شكراً جزيلاً','shukran jazeelan']];let current=null;qp.forEach(x=>{let b=document.createElement('button');b.className='chip';b.textContent=x[0];b.onclick=()=>{input.value=x[0];show(x,'Built-in phrase')};quick.appendChild(b)});function show(x,n){current=x;outAr.textContent=x[1];outTr.textContent=x[2]||'Use Hear to practice the pronunciation';outNote.textContent=n;result.classList.remove('hidden');day();store()}make.onclick=async()=>{let q=input.value.trim();if(!q)return;let x=[...all,...qp].find(a=>a[0].toLowerCase()===q.toLowerCase());if(x)return show(x,'Built-in learner phrase');make.disabled=true;make.textContent='Translating…';try{let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=en|ar');let j=await r.json();show([q,j.responseData.translatedText,''],'Live translation · pronunciation guide may be unavailable for new phrases')}catch(e){outNote.textContent='Could not connect to live translation. Try again with internet access.';result.classList.remove('hidden')}finally{make.disabled=false;make.textContent='Make it Arabic'}};clear.onclick=()=>{input.value='';result.classList.add('hidden')};outHear.onclick=()=>current&&speak(current[1]);outSlow.onclick=()=>current&&speak(current[1],true);save.onclick=()=>{if(current&&!S.saved.some(x=>x[1]===current[1])){S.saved.push(current);store()}save.textContent='Saved ✓'};copy.onclick=async()=>{if(current){await navigator.clipboard.writeText(current[1]);copy.textContent='Copied ✓'}};
let qa=null,locked=false;function quiz(){locked=false;feedback.textContent='';qa=all[Math.floor(Math.random()*all.length)];let en2ar=Math.random()<.5;qtype.textContent=en2ar?'Choose the Arabic meaning':'Choose the English meaning';qprompt.textContent=en2ar?qa[0]:qa[1];let opts=[qa,...all.filter(x=>x!==qa).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);choices.innerHTML='';opts.forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=en2ar?x[1]:x[0];b.onclick=()=>{if(locked)return;locked=true;S.total++;if(x===qa){S.right++;b.classList.add('good');feedback.textContent='Correct ✓'}else{b.classList.add('bad');[...choices.children].forEach((c,k)=>{if(opts[k]===qa)c.classList.add('good')});feedback.textContent='Review the green answer.'}day();store()};choices.appendChild(b)})}qnext.onclick=quiz;qhear.onclick=()=>qa&&speak(qa[1],true);reset.onclick=()=>{if(confirm('Reset progress on this phone?')){localStorage.removeItem('arabicCoach');location.reload()}};share.onclick=async()=>{let d={title:'Arabic Coach',text:'Practice Arabic with me',url:location.href};if(navigator.share)try{await navigator.share(d)}catch(e){}else navigator.clipboard.writeText(location.href)};render();quiz();stats();
</script></body></html>
